name: CI — TypeScript SDK

on:
  push:
    branches: [main]
    paths:
      - "libraries/typescript/**"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "libraries/typescript/**"
      - ".github/**"
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    working-directory: libraries/typescript

jobs:
  typescript-lint:
    name: TypeScript Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm exec biome format .
      - name: Lint
        run: pnpm exec biome check .
      - name: Typecheck
        run: pnpm exec tsc --noEmit

  typescript-test:
    name: TypeScript Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm exec vitest run --coverage
      - name: Build
        run: pnpm run build
      - name: Packed ESM/CJS and minimal/runtime consumers
        run: pnpm test:package

  typescript-reflect-platforms:
    name: Reflect filesystem and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run test/reflect test/api.test.ts test/trace-capture.test.ts
      - run: pnpm run build
      - run: pnpm test:package

  typescript-reflect-native:
    name: Reflect native framework loops (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix test/native --ignore-scripts --no-audit --no-fund
      - run: pnpm test:native
      - run: pnpm typecheck:native
