name: Release — TypeScript SDK

on:
  push:
    branches: [main]
    paths:
      - "libraries/typescript/src/version.ts"
  workflow_dispatch:
    inputs:
      dangerous-non-main-release:
        required: false
        type: boolean
        default: false
        description: "Release from a non-main branch (danger!)"

jobs:
  # ============================================================================
  # Gate: run the full CI suite before releasing
  # ============================================================================
  ci:
    name: CI
    uses: ./.github/workflows/ci-typescript.yml

  # ============================================================================
  # Release: build, tag, publish to GitHub and npm
  # ============================================================================
  release:
    name: Release to npm
    needs: [ci]
    if: github.ref == 'refs/heads/main' || inputs.dangerous-non-main-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for npm provenance
    defaults:
      run:
        working-directory: libraries/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from version.ts
        id: version
        run: |
          VERSION=$(node -e "const s=require('fs').readFileSync('src/version.ts','utf8'); const m=s.match(/\bVERSION\b\s*=\s*[\"']([^\"']+)[\"']/); if(!m){console.error('VERSION export not found in src/version.ts'); process.exit(1)} ; console.log(m[1])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check if version already released
        id: tag-check
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/typescript-v${{ steps.version.outputs.version }}$"; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "Tag typescript-v${{ steps.version.outputs.version }} already exists"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
            echo "Tag typescript-v${{ steps.version.outputs.version }} does not exist — proceeding"
          fi

      - name: Abort if already released
        if: steps.tag-check.outputs.already_released == 'true' && !inputs.dangerous-non-main-release
        run: |
          echo "::error::Version ${{ steps.version.outputs.version }} already released. Bump src/version.ts to release again."
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml

      - name: Upgrade npm (OIDC Trusted Publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package.json version from version.ts
        run: npm pkg set version=${{ steps.version.outputs.version }}

      - name: Build package
        run: pnpm run build

      - name: Verify package contents
        run: npm pack --dry-run

      # Publish to npm before tagging. If already published, skip publish but create the tag/release.
      - name: Publish to npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Compare the returned version string (not the exit code): `npm view`
          # for a missing version/package returns empty or errors, both of which
          # mean "not published yet".
          PUBLISHED=$(npm view "pandaprobe@${VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED" = "$VERSION" ]; then
            echo "pandaprobe@${VERSION} is already on npm — skipping publish."
          else
            npm publish --access public
          fi

      - name: Pack tarball (for the GitHub release)
        run: npm pack

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "libraries/typescript/*.tgz"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: typescript-v${{ steps.version.outputs.version }}
          name: "pandaprobe (TypeScript) v${{ steps.version.outputs.version }}"
          commit: ${{ github.sha }}
          draft: false
          generateReleaseNotes: true
          allowUpdates: true
