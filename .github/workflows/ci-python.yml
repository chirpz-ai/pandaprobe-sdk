name: CI — Python SDK

on:
  push:
    branches: [main]
    paths:
      - "libraries/python/**"
      - ".github/**"
  pull_request:
    branches: [main]
    paths:
      - "libraries/python/**"
      - ".github/**"
  workflow_call:
  workflow_dispatch:

jobs:
  # ============================================================================
  # Python CI
  # ============================================================================
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/python
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Check formatting
        run: make format-check

      - name: Lint
        run: make lint

  python-test:
    name: Python Test ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: libraries/python
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: make install

      - name: Test
        run: make test-cov

  reflect-frameworks:
    name: Reflect — ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {framework: langchain, python: "3.10", test: langchain_real, example: langchain}
          - {framework: langgraph, python: "3.10", test: native_langgraph, example: langgraph}
          - {framework: openai-agents, python: "3.10", test: openai_agents_real, example: openai_agents}
          - {framework: google-adk, python: "3.10", test: adk_real, example: google_adk}
          - {framework: crewai, python: "3.11", test: crewai_native, example: crewai}
          - {framework: claude-agent-sdk, python: "3.10", test: claude_native, example: claude}
          - {framework: deepagents, python: "3.11", test: deepagents_factory, example: deepagents}
    defaults:
      run:
        working-directory: libraries/python
    env:
      OTEL_SDK_DISABLED: "true"
      LITELLM_LOCAL_MODEL_COST_MAP: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --extra dev --extra ${{ matrix.framework }} --locked
      - run: >-
          uv run pytest tests/test_reflect_integrations.py tests/test_reflect_examples.py
          tests/test_reflect_failure_example.py tests/test_reflect_failure_frameworks.py
          -k '${{ matrix.test }} or ${{ matrix.example }}' -v
        env:
          # runner is available in step env, but not in job env.
          CREWAI_STORAGE_DIR: ${{ runner.temp }}/reflect-crewai

  reflect-platforms:
    name: Reflect — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: libraries/python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: >-
          uv run pytest tests/test_api.py tests/test_reflect_workspace.py tests/test_reflect_shell.py
          tests/test_reflect_runtime.py tests/test_reflect_validation.py
          tests/test_reflect_e2e.py tests/test_reflect_installation.py -v

  python-wheel:
    name: Python wheel and minimal installation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libraries/python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - run: uv build
      - run: uv run --extra dev --locked twine check dist/*
      - run: uv venv /tmp/pandaprobe-minimal
      - run: uv pip install --python /tmp/pandaprobe-minimal/bin/python dist/*.whl
      - name: Check optional import isolation in the installed wheel
        run: |
          cd /tmp
          /tmp/pandaprobe-minimal/bin/python - <<'PY'
          import importlib.util
          import pandaprobe
          assert importlib.util.find_spec("bashkit") is None
          assert importlib.util.find_spec("filelock") is None
          from pandaprobe.api import PlatformClient
          from pandaprobe.reflect import Reflect, ReflectConfig
          with pandaprobe.Client(enabled=False).trace("minimal"):
              pass
          PY
